<audio id="music" preload="auto"></audio>

<script>
(() => {
  const PLAYLIST = [
    "/music/love1.mp3",
    "/music/mice_on_venus.mp3",
  ];

  const audio = document.getElementById('music');
  let i = 0;

  const play = n => {
    i = (n + PLAYLIST.length) % PLAYLIST.length;
    audio.src = encodeURI(PLAYLIST[i]);
    audio.play().catch(() => {});
  };

  audio.addEventListener('ended', () => play(i + 1));

 play(0);
  const start = () => {
    if (audio.paused) audio.play().catch(() => {});
    ['click', 'touchstart', 'keydown'].forEach(e => removeEventListener(e, start));
  };
  ['click', 'touchstart', 'keydown'].forEach(e => addEventListener(e, start));
})();
</script>

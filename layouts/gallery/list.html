{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<div class="gallery">
{{ range .Resources.ByType "image" }}
{{ $thumb := .Resize "400x" }}
<a href="{{ .RelPermalink }}" data-title="{{ .Name }}">
<img src="{{ $thumb.RelPermalink }}" alt="{{ .Name }}" loading="lazy">
</a>
{{ end }}
</div>
<dialog id="viewer" class="xp-window">
<div class="xp-titlebar">
<span id="viewer-title"></span>
<button type="button" class="xp-close" id="viewer-close" aria-label="Close">&#10005;</button>
</div>
<div class="xp-body">
<img id="viewer-img" alt="">
</div>
</dialog>
<script src="{{ "js/gallery.js" | relURL }}"></script>
{{ end }}

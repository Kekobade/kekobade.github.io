{{ define "main" }}<h1>{{ .Title }}</h1>{{ .Content }}{{ $links := .Params.buttons | default dict }}<div class="buttons-grid">{{ range .Resources.ByType "image" }}{{ $url := index $links (lower .Name) }}{{ if $url }}<a href="{{ $url }}" target="_blank" rel="noopener">{{ end }}<img src="{{ .RelPermalink }}" width="88" height="31" alt="{{ .Name }}" loading="lazy">{{ if $url }}</a>{{ end }}{{ end }}</div> {{ end }}

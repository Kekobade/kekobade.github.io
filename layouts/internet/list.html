{{ define "main" }}<h1>{{ .Title }}</h1>{{ .Content }}<div class="buttons-grid">{{ range site.Data.internet }}{{ $img := .img }}{{ if not (hasPrefix $img "http") }}{{ $img = $img | relURL }}{{ end }}<a href="{{ .url }}" title="{{ .name }}" target="_blank" rel="noopener"><img src="{{ $img }}" alt="{{ .name }}" width="88" height="31" loading="lazy"></a>{{ end }}</div>{{ end }}

{{ define "main" }}{{ .Content }}
<h2>Latest blogposts</h2>
{{ partial "post-list.html" (first (site.Params.postsOnHome | default 5) (where site.RegularPages "Section" "blog")) }}

<h2>Friends</h2>
<div class="friends">
  {{ range site.Params.friends }}
  {{ with .url }}<a href="{{ . }}" target="_blank" rel="noopener">{{ end }}<img src="{{ .src | relURL }}" alt="{{ .alt }}" title="{{ .alt }}">{{ if .url }}</a>{{ end }}
  {{ end }}
</div>
{{ end }}
